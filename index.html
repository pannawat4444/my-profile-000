<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>My Profile</title>
    <link rel="Stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="profile-card">
      
      <img src="/images/profile.JPG" 
      alt="รูปโปรไฟล์" 
      class="profile-image" />

      <h1>My Profile</h1>
      <p>ชื่อ-นามสกุล: <span id="fullname">ปาณวัฐ รักรอดจิต</span></p>
      <p>ชื่อเล่น: <span id="nickname">บอล</span></p>
      <p>รหัสประจำตัว: <span id="studentID">6602041620106</span></p>

      <div class="motto">
        <h2>คติประจำใจ</h2>
        <p id="motto">ความพยายามอยู่ที่ไหน ใครจะไปรู้หล่ะ</p>
      </div>

      <button id="greetingBtn">ทักทาย</button>
      <p id="greetingMessage">ยินดีต้อนรับเข้าสู่โปรไฟล์ของฉัน</p>
    </main>
  </body>
</html>
